<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Konstantinos Pafitis — Contact</title>
<meta name="description" content="Get in touch with Konstantinos Pafitis.">
<link rel="stylesheet" href="assets/css/style.css?v=9">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">Paphitis</a>
    <nav class="site-nav">
      <a href="index.html#work">Work</a>
      <a href="about.html">About</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="contact-section" data-reveal>
    <div class="eyebrow">Contact</div>
    <h1>Get in touch</h1>
    <p>Have a project in mind, a question, or just want to say hi? Send a message and I'll get back to you.</p>

    <form class="contact-form" action="mailto:paphitis9@gmail.com" method="post" enctype="text/plain">
      <label class="field">
        <div class="field-label">Name</div>
        <input type="text" name="name" placeholder="Your name" required>
      </label>
      <label class="field">
        <div class="field-label">Email</div>
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <div class="field-label">Message</div>
        <textarea name="message" placeholder="What's on your mind?" rows="5" required></textarea>
      </label>
      <div class="form-note">Submitting opens your email client with this message addressed to me.</div>
      <button type="submit" class="btn btn-primary">Send message</button>
    </form>

    <div class="contact-links">
      <a href="mailto:paphitis9@gmail.com">paphitis9@gmail.com</a>
      <a href="https://github.com/Paphitis05" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/konstantinos-pafitis-3b416532b/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </section>
</main>

<script src="assets/js/main.js?v=9"></script>
</body>
</html>
